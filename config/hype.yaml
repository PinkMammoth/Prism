# HYPE valuation model. Every value here is a CONFIGURED ASSUMPTION (labelled as such in
# every output). Observed inputs come from Hyperliquid, DefiLlama and FRED; derived values
# are computed. See docs/HYPE_MODEL.md.

revenue:
  source_metric: dailyRevenue        # DefiLlama dataType for the `hyperliquid` protocol
  normalisation: blend               # blend | min | 30d | 90d | 365d
  blend_weights: {30d: 0.25, 90d: 0.50, 365d: 0.25}   # annualised run-rates
  min_window_coverage: 0.95          # a run-rate needs >=95% of its days present, else N/A
  haircut: 0.0                       # optional conservative haircut on normalised revenue
  af_share_of_revenue: 1.0           # share of protocol revenue that becomes buybacks
                                     # (reports: 97–99% of fees route to the Assistance Fund;
                                     #  revenue here is already "fees retained by protocol")

aqa_v2:
  active_since: 2026-08-26
  yield_share: 0.90                  # ~90% of cost-adjusted reserve yield shared (reported)
  cost_adjustment: 0.0035            # issuer/custody/distribution costs, p.a. (ASSUMPTION)
  eligible_fraction: 1.0             # share of USDC on Hyperliquid covered by AQAv2
  reserve_yield_series: DTB3         # observed T-bill yield (FRED), percent
  reserve_yield_override: null       # set e.g. 0.04 to force an assumed yield

dilution:                            # used for the NET structural yield (display)
  contributor_unlock_per_month: 9920000   # HYPE; published schedule (tokenomist), ASSUMPTION of timing
  contributor_unlock_until: 2027-11-30
  staking_emissions_per_year: null   # HYPE/yr; unknown -> N/A (not zero)
  contributor_sell_fraction: 0.5     # share of unlocks assumed sold (ASSUMPTION)

bands:                               # buyback yield -> signal (lower bound inclusive)
  - {min: 0.06, label: STRONGLY_UNDERVALUED}
  - {min: 0.05, label: UNDERVALUED}
  - {min: 0.04, label: FAIR}
  - {min: 0.03, label: OVERVALUED}
  - {min: 0.00, label: STRONGLY_OVERVALUED}

inverse_table:
  price_grid_pct: [-40, -30, -20, -10, 0, 10, 20, 30, 50]   # % around the current price
  target_yield: 0.045                                        # fair-band midpoint

sensitivity:
  revenue_pct: [-30, -15, 0, 15, 30]
  usdc_pct: [-30, 0, 30]
  reserve_yield_pp: [-1.0, 0.0, 1.0]
