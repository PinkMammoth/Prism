# Tradable universe. One provider per (asset, timeframe) — see docs/DATA_SOURCES.md.
# Changing a series' provider creates a NEW series (never stitched); the change is logged.
#
# timeframes: 1d is required for research; 4h/1h are optional entry-refinement data.
assets:
  # ---------------- Crypto ----------------
  BTC:
    name: Bitcoin
    asset_class: crypto
    currency: USD
    calendar: crypto
    series:
      1d: {provider: coinbase, symbol: BTC-USD}
      4h: {provider: coinbase, symbol: BTC-USD}
    provider_ids: {coinbase: BTC-USD, bitstamp: btcusd, defillama_chain: Bitcoin}
  ETH:
    name: Ethereum
    asset_class: crypto
    currency: USD
    calendar: crypto
    series:
      1d: {provider: coinbase, symbol: ETH-USD}
      4h: {provider: coinbase, symbol: ETH-USD}
    provider_ids: {coinbase: ETH-USD, bitstamp: ethusd, defillama_chain: Ethereum}
  SOL:
    name: Solana
    asset_class: crypto
    currency: USD
    calendar: crypto
    series:
      1d: {provider: coinbase, symbol: SOL-USD}
      4h: {provider: coinbase, symbol: SOL-USD}
    provider_ids: {coinbase: SOL-USD, bitstamp: solusd, defillama_chain: Solana}
  HYPE:
    name: Hyperliquid
    asset_class: crypto
    currency: USD
    calendar: crypto
    notes: "Quoted in USDC on Hyperliquid spot; treated as USD (basis risk documented)."
    series:
      1d: {provider: hyperliquid, symbol: HYPE}
      4h: {provider: hyperliquid, symbol: HYPE}
    provider_ids: {hyperliquid_spot_pair: "@107", defillama_protocol: hyperliquid}
  LINK:
    name: Chainlink
    asset_class: crypto
    currency: USD
    calendar: crypto
    series:
      1d: {provider: coinbase, symbol: LINK-USD}
      4h: {provider: coinbase, symbol: LINK-USD}
    provider_ids: {coinbase: LINK-USD, bitstamp: linkusd, defillama_protocol: chainlink}
  AAVE:
    name: Aave
    asset_class: crypto
    currency: USD
    calendar: crypto
    series:
      1d: {provider: coinbase, symbol: AAVE-USD}
      4h: {provider: coinbase, symbol: AAVE-USD}
    provider_ids: {coinbase: AAVE-USD, bitstamp: aaveusd, defillama_protocol: aave}

