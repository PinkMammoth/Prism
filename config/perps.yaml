# Perpetual futures data (Phase 1: data + funding monitor; no strategy is tested yet).
# Venue: Hyperliquid public info API (free, no key). Perp series are stored SEPARATELY from
# spot prices (perp_bars / perp_funding / perp_snapshots) and never stitched to them.
venue: hyperliquid
coins: [BTC, ETH, SOL, HYPE, LINK, AAVE]   # Hyperliquid perp names

funding:
  backfill_days: 1095        # first run: up to 3 years of hourly funding (or the coin's whole history)
  page_size: 500             # rows per fundingHistory response (Hyperliquid's documented limit)
  periods_per_year: 8760     # Hyperliquid funding is paid hourly; annualised = rate × 8760

monitor:
  window_days: 365           # history the current funding is compared against
  avg_days: 7                # "current" funding = mean of the last N days (smooths hourly noise)
  crowded_long_pct: 0.90     # 7d funding at/above this percentile of its own year → "crowded long"
  crowded_short_pct: 0.10    # at/below → "crowded short"

# ---------------------------------------------------------------- Phase 2: backtest engine
# Assumptions, not facts: check Hyperliquid's current fee schedule and margin tables.
costs:                       # per side, on notional
  taker_fee_bps: 4.5         # Hyperliquid base-tier taker fee (0.045%); entries/exits are market orders
  slippage_bps: {BTC: 2, ETH: 2, SOL: 4, HYPE: 6, LINK: 6, AAVE: 8, default: 8}
  stop_slippage_bps: 10      # extra adverse slippage when a stop fires (stop-market in a fast move)

margin:
  # maintenance margin rate = 1 / (2 × venue max leverage) (Hyperliquid's published rule);
  # used when no snapshot is stored for a coin
  default_max_leverage: {BTC: 40, ETH: 25, SOL: 20, HYPE: 10, LINK: 10, AAVE: 10, default: 10}

risk:
  risk_per_trade: 0.005      # 0.5% of equity lost if the stop is hit (before slippage)
  leverage_cap: 3.0          # hard cap per position, regardless of venue maximum
  liq_buffer: 2.0            # liquidation must sit >= 2 × the stop distance away at entry
  max_gross_notional: 2.0    # sum of position notionals <= 2 × equity
  max_position_notional: 0.5 # any one position's notional <= 50% of equity

event_study:
  horizons: {1d: 1, 3d: 3, 1w: 7, 2w: 14, 1m: 30, 3m: 91}   # bars (daily, 24/7)
  primary_horizon: 1m
  min_funding_coverage: 0.8   # share of a day's expected settlements needed; fewer → that day's funding
                              # is missing (and so is any return spanning it)

# ---------------------------------------------------------------- Phase 3: strategy research
# Strategy defaults are pre-registered in src/market_signal/perps/strategies.py.
# Verdicts use the SAME automatic criteria as spot research (config/backtest.yaml).
research:
  walk_forward:              # perp history is ~2-3 years, so shorter windows than spot
    train_years: 1.0
    test_years: 0.5
    anchored: true
    min_train_events: 20
    objective: median_excess
  initial_equity: 100000

# ---------------------------------------------------------------- second venue: Binance USD-M
# Used for history only: to test the SAME pre-registered strategies on years before
# Hyperliquid's data begins. Never mixed with Hyperliquid series (separate `source`).
venues:
  binance:
    enabled: true
    history_start: "2019-09-01"     # Binance USD-M perps launched Sept 2019
    symbols: {BTC: BTCUSDT, ETH: ETHUSDT, SOL: SOLUSDT, LINK: LINKUSDT, AAVE: AAVEUSDT}
    taker_fee_bps: 5.0              # base-tier USD-M taker fee (0.05%), an assumption
    max_leverage: {default: 20}     # only bounds leverage; Prism's 3x cap applies first
    maintenance_rate: {BTC: 0.004, ETH: 0.005, default: 0.01}   # lowest tier, conservative for alts

# ---------------------------------------------------------------- open interest (data collection only)
# Infrastructure for later research; NOT a feature or a signal. See docs/OPEN_INTEREST.md.
# Venues are stored separately and never merged.
open_interest:
  hyperliquid:                      # prospective snapshots in perp_snapshots; no history API
    min_snapshot_gap_minutes: 5     # back-to-back runs (daily job + OI collector) record once
    stale_hours: 20                 # doctor: STALE when the newest snapshot is older (lost for good)
    gap_hours: 20                   # doctor: count gaps longer than this (overnight PC-off is shorter)
  binance:                          # GET /futures/data/openInterestHist (USD-M), rolling backfill
    enabled: true
    period: 1h                      # raw statistics period stored (5m…1d available; 1h: 720 rows/30d/coin)
    history_days: 30                # Binance serves only the latest ~30 days (verified 2026-10-03)
    overlap_periods: 3              # re-read the newest few points every run
    stale_hours: 12                 # doctor: newest row older → "stale" (still recoverable)
    recovery_warn_days: 20          # doctor: "AT RISK" — the oldest missing hours drop out at ~30d
    symbols: {BTC: BTCUSDT, ETH: ETHUSDT, SOL: SOLUSDT, HYPE: HYPEUSDT, LINK: LINKUSDT, AAVE: AAVEUSDT}
