# /etc/ssh/sshd_config.d/10-prism.conf: key-only SSH. PermitRootLogin is switched to "no" by
# `bootstrap.sh --lock-root` only AFTER a non-root sudo login has been verified.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
PermitRootLogin prohibit-password
