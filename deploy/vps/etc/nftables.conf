#!/usr/sbin/nft -f
# /etc/nftables.conf: inbound deny by default. SSH only (optionally from an allowlist);
# 80/443 only if a gateway/API is ever exposed through Caddy. No DuckDB/other ports.
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    # Restrict where practical, e.g.: tcp dport 22 ip saddr { 203.0.113.7 } accept
    tcp dport 22 ct state new limit rate 10/minute accept
    # tcp dport { 80, 443 } accept   # enable only with Caddy + an approved exposed endpoint
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output priority 0; policy accept; }
}
