[Service]
# Keep the original backup identity and canonical scheduled Drive pipeline.
# Reconcile stranded source snapshots before asking the owner for another copy.
ExecStartPre=
ExecStartPre=+/usr/bin/systemctl start prism-research-backup-reconcile.service
ExecStartPre=+/usr/bin/systemctl start prism-research-backup-source.service
# Same backup identity and canonical command, with a bounded shared-repository lock.
ExecStart=
ExecStart=/usr/bin/flock --wait 1800 /var/lib/prism-research-backup/repository.lifecycle.lock /opt/prism/research/current/.venv/bin/python /opt/prism/research/current/scripts/research_backup.py scheduled --config /etc/prism-research-backup/backup.json
