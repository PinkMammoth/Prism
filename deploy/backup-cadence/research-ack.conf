[Service]
ExecStart=
Environment=PYTHONPATH=/opt/prism/research/current/src
ExecStart=/opt/prism/research/current/.venv/bin/python /opt/prism/backup-cadence/cadence.py finish research
ReadWritePaths=/var/lib/prism-research/import/prism.duckdb.runtime.lock /var/lib/prism-research-backup/cadence/research
# ACK now includes full governed verification/retention. Match the existing backup
# verifier budget; the old 512M / 5min budget covered checksum-only ACK/unlink.
MemoryMax=3G
CPUQuota=100%
Nice=19
IOSchedulingClass=idle
TimeoutStartSec=30min
